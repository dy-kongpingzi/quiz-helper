<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快速答题助手</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
            color: #333; min-height: 100vh;
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
        header { text-align: center; margin-bottom: 28px; }
        header h1 { font-size: 28px; color: #1a1a2e; margin-bottom: 4px; letter-spacing: 1px; }
        header p { color: #888; font-size: 13px; }

        .upload-zone {
            border: 2.5px dashed #c0c4cc; border-radius: 14px; padding: 44px 24px;
            text-align: center; background: #fff; cursor: pointer;
            transition: all 0.3s; margin-bottom: 22px;
        }
        .upload-zone:hover, .upload-zone.dragover { border-color: #409eff; background: #ecf5ff; }
        .upload-zone .icon { font-size: 44px; margin-bottom: 10px; }
        .upload-zone p { color: #555; font-size: 15px; }
        .upload-zone .hint { color: #aaa; font-size: 12px; margin-top: 6px; }

        .card {
            background: #fff; border-radius: 14px; padding: 22px 26px;
            margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); display: none;
        }
        .stat-row { display: flex; gap: 32px; flex-wrap: wrap; align-items: center; }
        .stat-item { display: flex; align-items: center; gap: 6px; }
        .stat-item .label { color: #888; font-size: 13px; }
        .stat-item .value { font-size: 20px; font-weight: 700; color: #409eff; }
        .dup-info { margin-top: 12px; padding: 10px 14px; background: #fdf6ec; border-radius: 8px; color: #b88230; font-size: 12px; display: none; }
        .add-info { margin-top: 12px; padding: 10px 14px; background: #f0f9eb; border-radius: 8px; color: #4ea832; font-size: 12px; display: none; }

        .section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #1a1a2e; display: flex; align-items: center; gap: 7px; }
        .legend { font-size: 11px; color: #aaa; font-weight: normal; margin-left: 8px; }
        .section-clear-btn {
            margin-left: auto; padding: 3px 10px; background: transparent; border: 1px solid #dcdfe6;
            border-radius: 10px; font-size: 11px; cursor: pointer; color: #999;
            transition: all 0.2s; white-space: nowrap;
        }
        .section-clear-btn:hover { border-color: #f56c6c; color: #f56c6c; background: #fef0f0; }

        .text-search-wrap { position: relative; margin-bottom: 16px; }
        .text-search-wrap input {
            width: 100%; padding: 11px 60px 11px 16px; border: 2px solid #d0d5dd;
            border-radius: 12px; font-size: 15px; outline: none; transition: border-color 0.3s;
            background: #fcfcfd;
        }
        .text-search-wrap input:focus { border-color: #409eff; background: #fff; }
        .text-search-wrap input::placeholder { color: #bbb; }
        .text-search-clear {
            position: absolute; right: 38px; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: #c0c4cc; font-size: 16px; display: none; padding: 2px 4px;
        }
        .text-search-clear:hover { color: #f56c6c; }
        .voice-btn {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: #c0c4cc; font-size: 18px; padding: 2px 4px;
            border: none; background: none; transition: color 0.2s; line-height: 1;
        }
        .voice-btn:hover { color: #409eff; }
        .voice-btn.recording { color: #f56c6c; }
        .voice-indicator {
            display: none; align-items: center; gap: 10px; padding: 8px 14px;
            background: linear-gradient(90deg, #fef0f0, #fff5f5); border: 1.5px solid #fbc4c4;
            border-radius: 10px; margin-top: 8px; animation: viSlideIn 0.2s;
        }
        .voice-indicator.on { display: flex; }
        @keyframes viSlideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
        .vi-waves { display: flex; align-items: center; gap: 3px; height: 20px; }
        .vi-bar {
            width: 3px; background: #f56c6c; border-radius: 2px;
            animation: viWave 0.8s ease-in-out infinite;
        }
        .vi-bar:nth-child(1) { height: 8px; animation-delay: 0s; }
        .vi-bar:nth-child(2) { height: 14px; animation-delay: 0.15s; }
        .vi-bar:nth-child(3) { height: 20px; animation-delay: 0.3s; }
        .vi-bar:nth-child(4) { height: 14px; animation-delay: 0.45s; }
        .vi-bar:nth-child(5) { height: 8px; animation-delay: 0.6s; }
        @keyframes viWave {
            0%, 100% { transform: scaleY(0.4); }
            50% { transform: scaleY(1); }
        }
        .vi-text { font-size: 13px; color: #f56c6c; font-weight: 500; }
        .vi-stop { padding: 4px 14px; border: 1.5px solid #f56c6c; border-radius: 8px; background: #fff; color: #f56c6c; font-size: 12px; cursor: pointer; margin-left: auto; transition: all 0.2s; }
        .vi-stop:hover { background: #f56c6c; color: #fff; }

        .selected-bar { display: none; margin-bottom: 12px; }
        .selected-bar-inner { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: #ecf5ff; border-radius: 10px; flex-wrap: wrap; }
        .selected-bar-inner .lbl { color: #409eff; font-weight: 600; font-size: 12px; white-space: nowrap; }
        .sel-chip { display: inline-flex; align-items: center; gap: 3px; padding: 3px 10px; background: #409eff; color: #fff; border-radius: 12px; font-size: 11px; cursor: pointer; transition: background 0.2s; }
        .sel-chip:hover { background: #2b7de0; }
        .clear-btn { margin-left: auto; padding: 4px 12px; background: transparent; border: 1px solid #409eff; color: #409eff; border-radius: 12px; font-size: 11px; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .clear-btn:hover { background: #409eff; color: #fff; }

        .scope-row { display: none; align-items: center; gap: 10px; margin-bottom: 12px; padding: 8px 14px; background: #f9f9fb; border-radius: 10px; flex-wrap: wrap; }
        .scope-row .scope-lbl { font-size: 12px; color: #666; white-space: nowrap; }
        .scope-btn { padding: 5px 18px; border: 1.5px solid #dcdfe6; border-radius: 18px; background: #fff; font-size: 12px; cursor: pointer; transition: all 0.2s; color: #666; font-weight: 500; }
        .scope-btn.on { background: #409eff; border-color: #409eff; color: #fff; }
        .scope-btn:hover:not(.on) { border-color: #409eff; color: #409eff; }
        .scope-hint { font-size: 11px; color: #aaa; margin-left: 4px; }

        .num-section { display: flex; gap: 10px; margin-bottom: 14px; padding: 10px 14px; background: #fafbfc; border-radius: 10px; align-items: center; flex-wrap: wrap; }
        .num-input-row { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .num-input-row input { width: 80px; padding: 5px 8px; border: 1.5px solid #dcdfe6; border-radius: 8px; font-family: 'Cascadia Code','Consolas',monospace; font-size: 14px; outline: none; color: #409eff; font-weight: 600; transition: border-color 0.3s; }
        .num-input-row input:focus { border-color: #409eff; }
        .num-input-row input::placeholder { color: #ccc; font-weight: 400; font-size: 11px; }
        .num-unit-tag { padding: 3px 8px; background: #e6a23c; color: #fff; border-radius: 10px; font-size: 11px; font-weight: 500; display: none; }
        .num-clear-x { cursor: pointer; color: #c0c4cc; font-size: 14px; padding: 0 4px; display: none; transition: color 0.2s; }
        .num-clear-x:hover { color: #f56c6c; }
        .numpad { display: flex; gap: 3px; flex-shrink: 0; }
        .numpad button { width: 32px; height: 30px; border: 1px solid #e0e0e0; border-radius: 6px; background: #fff; font-size: 13px; cursor: pointer; transition: all 0.15s; color: #333; font-weight: 500; padding: 0; }
        .numpad button:hover { background: #ecf5ff; border-color: #a0cfff; }
        .numpad button:active { background: #d9ecff; transform: scale(0.95); }
        .num-divider { width: 1px; height: 24px; background: #e0e0e0; flex-shrink: 0; }
        .unit-chips { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; min-width: 0; }
        .unit-chip { padding: 4px 10px; border: 1px solid #e0e0e0; border-radius: 12px; font-size: 11px; cursor: pointer; background: #fff; transition: all 0.2s; color: #555; }
        .unit-chip:hover { border-color: #e6a23c; color: #e6a23c; }
        .unit-chip.on { background: #e6a23c; color: #fff; border-color: #e6a23c; }

        .kw-filter-wrap { position: relative; margin-bottom: 12px; }
        .kw-filter-wrap input { width: 100%; padding: 8px 32px 8px 14px; border: 1.5px solid #dcdfe6; border-radius: 10px; font-size: 12px; outline: none; transition: border-color 0.3s; }
        .kw-filter-wrap input:focus { border-color: #409eff; }
        .kw-filter-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #c0c4cc; font-size: 14px; display: none; padding: 2px 4px; }
        .kw-filter-clear:hover { color: #f56c6c; }

        .kw-box { display: flex; flex-wrap: wrap; gap: 7px; max-height: 400px; overflow-y: auto; padding: 2px; align-content: flex-start; transition: max-height 0.3s; }
        .kw-box.collapsed { max-height: 0; overflow: hidden; padding: 0; margin: 0; }
        .kw-toggle-btn {
            display: none; width: 100%; padding: 6px; border: 1px solid #ebeef5; border-radius: 8px;
            background: #f9f9fb; color: #999; font-size: 12px; cursor: pointer; text-align: center;
            margin-top: 6px; transition: all 0.2s;
        }
        .kw-toggle-btn:hover { border-color: #409eff; color: #409eff; }
        .kw-chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 13px; border-radius: 18px; font-size: 12px; cursor: pointer; transition: all 0.2s; border: 1.5px solid; user-select: none; }
        .kw-chip .src { font-size: 9px; opacity: 0.6; }
        .kw-chip.f1 { background: #f0f9eb; border-color: #b3e19d; color: #4ea832; }
        .kw-chip.f2 { background: #fdf6ec; border-color: #f3d19e; color: #cf8e1e; }
        .kw-chip.f3 { background: #fef0f0; border-color: #fab6b6; color: #e04848; }
        .kw-chip.active { background: #409eff !important; border-color: #409eff !important; color: #fff !important; box-shadow: 0 3px 10px rgba(64,158,255,0.3); }
        .kw-chip:hover:not(.active) { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .kw-visible-count { font-size: 11px; color: #bbb; margin-bottom: 8px; }
        .kw-letter-hdr {
            width: 100%; font-size: 12px; font-weight: 700; color: #409eff;
            padding: 8px 4px 3px; margin-top: 2px;
            border-bottom: 1px solid #ebeef5;
        }
        .kw-letter-hdr:first-child { margin-top: 0; padding-top: 2px; }

        .results-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .results-cnt { color: #888; font-size: 13px; }
        .q-list { display: flex; flex-direction: column; gap: 10px; }
        .q-card { border: 1.5px solid #ebeef5; border-radius: 10px; padding: 14px 18px; transition: all 0.2s; }
        .q-card:hover { border-color: #a0cfff; box-shadow: 0 2px 8px rgba(64,158,255,0.1); }
        .q-num { font-size: 11px; color: #b0b0b0; margin-bottom: 5px; }
        .q-text { font-size: 14px; line-height: 1.7; margin-bottom: 10px; color: #222; }
        .q-text .hl { background: #ffe082; padding: 1px 3px; border-radius: 3px; }
        .a-wrap { cursor: pointer; user-select: none; }
        .a-lbl { font-size: 12px; color: #409eff; font-weight: 600; margin-bottom: 5px; display: flex; align-items: center; gap: 5px; }
        .a-lbl .arrow { display: inline-block; transition: transform 0.2s; font-size: 10px; }
        .a-wrap.open .arrow { transform: rotate(90deg); }
        .a-body { font-size: 14px; line-height: 1.7; color: #555; background: #f5f7fa; padding: 10px 14px; border-radius: 8px; display: none; white-space: pre-line; }
        .a-body .hl { background: #c8e6c9; padding: 1px 3px; border-radius: 3px; }
        .a-wrap.open .a-body { display: block; }
        .load-more { text-align: center; padding: 12px; }
        .load-more button { padding: 7px 26px; background: #409eff; color: #fff; border: none; border-radius: 18px; font-size: 13px; cursor: pointer; transition: background 0.2s; }
        .load-more button:hover { background: #2b7de0; }
        .no-result { text-align: center; padding: 36px 0; color: #bbb; font-size: 14px; }
        .kw-box::-webkit-scrollbar { width: 5px; }
        .kw-box::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
        .footer-clear { text-align: right; padding: 16px 0 8px; opacity: 0.35; transition: opacity 0.3s; }
        .footer-clear:hover { opacity: 0.7; }
        .footer-clear span { cursor: pointer; font-size: 11px; color: #999; border-bottom: 1px dashed #ccc; padding-bottom: 1px; }
        /* ===== Editor Modal ===== */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
            z-index: 1000; justify-content: center; align-items: flex-start; padding: 40px 16px;
            overflow-y: auto;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: #fff; border-radius: 16px; width: 100%; max-width: 780px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.18); animation: modalIn 0.2s;
        }
        @keyframes modalIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .modal-hdr {
            display: flex; align-items: center; padding: 18px 24px; border-bottom: 1px solid #ebeef5;
        }
        .modal-hdr h3 { font-size: 17px; color: #1a1a2e; flex: 1; }
        .modal-close { cursor: pointer; font-size: 22px; color: #c0c4cc; padding: 4px 8px; border-radius: 6px; transition: all 0.2s; border: none; background: none; }
        .modal-close:hover { color: #f56c6c; background: #fef0f0; }
        .modal-body { padding: 20px 24px; }
        .modal-footer { padding: 14px 24px; border-top: 1px solid #ebeef5; display: flex; justify-content: flex-end; gap: 10px; }
        .ed-label { font-size: 12px; font-weight: 600; color: #666; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .ed-label .hint { font-weight: 400; color: #bbb; font-size: 11px; }
        .ed-textarea {
            width: 100%; min-height: 80px; padding: 10px 14px; border: 1.5px solid #dcdfe6;
            border-radius: 10px; font-size: 13px; line-height: 1.7; resize: vertical;
            outline: none; transition: border-color 0.3s; font-family: inherit;
        }
        .ed-textarea:focus { border-color: #409eff; }
        .ed-field { margin-bottom: 16px; }
        .ed-kw-section { margin-top: 8px; padding: 14px 16px; background: #f9f9fb; border-radius: 10px; }
        .ed-kw-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; min-height: 28px; }
        .ed-kw-chip {
            display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 14px;
            font-size: 12px; background: #ecf5ff; border: 1px solid #b3d8ff; color: #409eff; cursor: default;
        }
        .ed-kw-chip .ed-kw-x { cursor: pointer; font-size: 13px; margin-left: 2px; opacity: 0.6; }
        .ed-kw-chip .ed-kw-x:hover { opacity: 1; color: #f56c6c; }
        .ed-add-row { display: flex; gap: 6px; margin-top: 10px; }
        .ed-add-row input {
            flex: 1; padding: 6px 12px; border: 1.5px solid #dcdfe6; border-radius: 8px;
            font-size: 12px; outline: none; transition: border-color 0.3s;
        }
        .ed-add-row input:focus { border-color: #409eff; }
        .ed-btn {
            padding: 6px 16px; border-radius: 8px; font-size: 12px; cursor: pointer;
            border: 1.5px solid; transition: all 0.2s; font-weight: 500;
        }
        .ed-btn-primary { background: #409eff; color: #fff; border-color: #409eff; }
        .ed-btn-primary:hover { background: #2b7de0; border-color: #2b7de0; }
        .ed-btn-default { background: #fff; color: #666; border-color: #dcdfe6; }
        .ed-btn-default:hover { border-color: #409eff; color: #409eff; }
        .ed-btn-danger { background: #fff; color: #f56c6c; border-color: #fbc4c4; }
        .ed-btn-danger:hover { background: #fef0f0; border-color: #f56c6c; }
        .ed-select-hint {
            font-size: 11px; color: #67c23a; margin-top: 6px; padding: 6px 10px;
            background: #f0f9eb; border-radius: 6px; display: none;
        }
        .q-card .q-edit-btn {
            float: right; padding: 2px 10px; border: 1px solid #dcdfe6; border-radius: 6px;
            font-size: 11px; cursor: pointer; color: #999; background: #fff; transition: all 0.2s;
        }
        .q-card .q-edit-btn:hover { border-color: #409eff; color: #409eff; }
        /* ===== Keyword Manager Modal ===== */
        .kwm-list { max-height: 400px; overflow-y: auto; }
        .kwm-row {
            display: flex; align-items: center; gap: 8px; padding: 8px 10px;
            border-bottom: 1px solid #f0f0f0; transition: background 0.15s;
        }
        .kwm-row:hover { background: #f9f9fb; }
        .kwm-word { flex: 1; font-size: 13px; color: #333; }
        .kwm-cnt { font-size: 11px; color: #aaa; min-width: 30px; text-align: right; }
        .kwm-actions { display: flex; gap: 4px; }
        .kwm-btn {
            padding: 3px 8px; border: 1px solid #dcdfe6; border-radius: 6px; font-size: 11px;
            cursor: pointer; background: #fff; color: #666; transition: all 0.2s;
        }
        .kwm-btn:hover { border-color: #409eff; color: #409eff; }
        .kwm-btn.danger:hover { border-color: #f56c6c; color: #f56c6c; }
        .kwm-search { width: 100%; padding: 8px 14px; border: 1.5px solid #dcdfe6; border-radius: 10px; font-size: 13px; outline: none; margin-bottom: 12px; }
        .kwm-search:focus { border-color: #409eff; }
        .kwm-empty { text-align: center; padding: 24px; color: #bbb; font-size: 13px; }
        .kwm-toolbar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .kwm-toolbar .ed-btn { flex: 1; text-align: center; min-width: 0; white-space: nowrap; }
        /* ===== Sort Controls ===== */
        .sort-bar { display: flex; align-items: center; gap: 6px; margin-left: auto; }
        .sort-bar .sort-label { font-size: 12px; color: #999; white-space: nowrap; }
        .sort-bar select {
            padding: 4px 10px; border: 1.5px solid #dcdfe6; border-radius: 8px;
            font-size: 12px; color: #555; background: #fff; outline: none;
            cursor: pointer; transition: border-color 0.2s;
        }
        .sort-bar select:focus { border-color: #409eff; }
        /* ===== Cloud Sync Indicator ===== */
        .sync-bar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 2000;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 6px 16px; font-size: 12px; transition: all 0.4s;
            pointer-events: none; opacity: 0; transform: translateY(-100%);
        }
        .sync-bar.show { opacity: 1; transform: translateY(0); }
        .sync-bar.syncing { background: #ecf5ff; color: #409eff; }
        .sync-bar.success { background: #f0f9eb; color: #67c23a; }
        .sync-bar.error { background: #fef0f0; color: #f56c6c; }
        .sync-bar.offline { background: #fdf6ec; color: #e6a23c; }
        .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
        .sync-bar.syncing .sync-dot { animation: syncPulse 1s infinite; }
        @keyframes syncPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        .cloud-badge {
            position: absolute; top: 8px; right: 24px; font-size: 11px; color: #67c23a;
            display: flex; align-items: center; gap: 4px;
        }
        .cloud-badge.offline { color: #e6a23c; }
        .loading-overlay {
            position: fixed; inset: 0; background: rgba(255,255,255,0.85); z-index: 3000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        }
        .loading-spinner {
            width: 36px; height: 36px; border: 3px solid #e4e9f2; border-top-color: #409eff;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 14px; color: #666; }
        /* ===== Import Duplicate Modal ===== */
        .dup-list-box { max-height: 200px; overflow-y: auto; margin: 10px 0; padding: 10px; background: #f9f9fb; border-radius: 8px; font-size: 12px; line-height: 1.8; }
        .dup-list-box .dup-item { color: #e6a23c; }
        @media (max-width: 768px) {
            .container { padding: 12px 10px; }
            .upload-zone { padding: 24px 12px; }
            .stat-row { gap: 10px; }
            .modal-overlay { padding: 12px 6px; }
            header h1 { font-size: 22px; }
            .card { padding: 14px 12px; }
            .section-title { font-size: 14px; flex-wrap: wrap; gap: 4px; }
            .legend { display: none; }
            .num-section { flex-wrap: wrap; padding: 8px 10px; gap: 8px; }
            .numpad button { width: 28px; height: 26px; font-size: 12px; }
            .num-input-row input { width: 60px; font-size: 13px; padding: 4px 6px; }
            .num-divider { display: none; }
            .kw-box { max-height: 200px; gap: 5px; }
            .kw-chip { padding: 3px 9px; font-size: 11px; border-radius: 14px; }
            .kw-letter-hdr { font-size: 11px; padding: 5px 2px 2px; }
            .kw-toggle-btn { display: block; }
            .kw-filter-wrap input { font-size: 13px; padding: 9px 32px 9px 12px; }
            .text-search-wrap input { font-size: 14px; padding: 10px 36px 10px 12px; }
            .results-hdr { flex-wrap: wrap; gap: 6px; }

<div class="container">
    <header>

        <p>上传题库 CSV，通过搜索 / 关键词 / 数字快速定位题目与答案</p>
        <div class="cloud-badge" id="cloudBadge">☁️ 云端同步</div>
    </header>

    <div class="upload-zone" id="dropZone">
        <div class="icon">📄</div>
        <p id="uploadText">拖拽 CSV 文件到此处，或点击上传</p>
        <div class="hint">CSV 格式：序号, 题目, 答案 · 支持增量添加 · 自动清洗答案格式</div>
        <input type="file" id="fileInput" accept=".csv" style="display:none">
    </div>

    <div class="card" id="statsCard">
        <div class="stat-row">
            <div class="stat-item"><span class="label">题库总数</span><span class="value" id="sTotal">0</span></div>
            <div class="stat-item"><span class="label">关键词</span><span class="value" id="sKw">0</span></div>
            <div class="stat-item"><span class="label">数字/单位</span><span class="value" id="sUnit">0</span></div>
        </div>
        <div class="dup-info" id="dupInfo"></div>
        <div class="add-info" id="addInfo"></div>
    </div>

    <div class="card" id="kwCard">
        <div class="section-title"><span>🔍</span>搜索</div>
        <div class="text-search-wrap">
            <input type="text" id="textSearch" placeholder="输入任意内容搜索（空格分隔多个词，取交集）">
            <span class="text-search-clear" id="textSearchClear" onclick="clearTextSearch()">✕</span>
            <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()" title="语音输入">🎤</button>
        </div>
        <div class="voice-indicator" id="voiceIndicator">
            <div class="vi-waves"><div class="vi-bar"></div><div class="vi-bar"></div><div class="vi-bar"></div><div class="vi-bar"></div><div class="vi-bar"></div></div>
            <span class="vi-text">正在聆听...</span>
            <button class="vi-stop" onclick="stopVoice()">停止</button>
        </div>

        <div class="selected-bar" id="selBar">
            <div class="selected-bar-inner">
                <span class="lbl">已选：</span>
                <div id="selChips"></div>
                <button class="clear-btn" id="clearBtn">清除全部</button>
            </div>
        </div>
        <div class="scope-row" id="scopeRow">
            <span class="scope-lbl">搜索范围：</span>
            <button class="scope-btn on" id="btnScopeQ" onclick="toggleScope('q')">题目</button>
            <button class="scope-btn on" id="btnScopeA" onclick="toggleScope('a')">答案</button>
            <span class="scope-hint" id="scopeHint"></span>
        </div>

        <div class="section-title" style="margin-top:4px">
            <span>🔢</span>数字 & 单位
            <button class="section-clear-btn" onclick="clearNumSection()">清除</button>
        </div>
        <div class="num-section">
            <div class="num-input-row">
                <input type="text" id="numField" placeholder="数字..." inputmode="decimal">
                <span class="num-unit-tag" id="numUnitTag"></span>
                <span class="num-clear-x" id="numClearX" onclick="numClearAll()">✕</span>
            </div>
            <div class="numpad">
                <button onclick="numTap('1')">1</button><button onclick="numTap('2')">2</button><button onclick="numTap('3')">3</button><button onclick="numTap('4')">4</button><button onclick="numTap('5')">5</button><button onclick="numTap('6')">6</button><button onclick="numTap('7')">7</button><button onclick="numTap('8')">8</button><button onclick="numTap('9')">9</button><button onclick="numTap('0')">0</button><button onclick="numTap('.')">.</button><button onclick="numBack()">⌫</button>

            <div class="num-divider"></div>
            <div class="unit-chips" id="unitChips"></div>
        </div>

            <button class="section-clear-btn" onclick="clearKwSection()">清除选中</button>
        </div>
        <div class="kw-filter-wrap">
            <input type="text" id="kwFilter" placeholder="搜索关键词 / 题目 / 答案...">
            <span class="kw-filter-clear" id="kwFilterClear" onclick="clearKwFilter()">✕</span>
        </div>
        <div class="kw-visible-count" id="kwVisCount"></div>
        <div class="kw-box" id="kwBox"></div>
        <button class="kw-toggle-btn" id="kwToggle" onclick="toggleKwBox()">收起关键词 ▲</button>
    </div>

    <div class="card" id="resCard">
        <div class="results-hdr">

    <div class="footer-clear"><span onclick="clearAllData()">清空题库</span></div>
</div>

<!-- Question Editor Modal -->
<div class="modal-overlay" id="edModal">

        </div>

                <div class="ed-label">答案</div>
                <textarea class="ed-textarea" id="edA" rows="4"></textarea>
            </div>

                <div class="ed-select-hint" id="edSelHint">已选中：<b id="edSelText"></b></div>

                    <button class="ed-btn ed-btn-default" id="edAddSelBtn" onclick="edAddSelection()" style="display:none">添加选中文字</button>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="ed-btn ed-btn-danger" onclick="edDelete()">删除此题</button>

            <button class="ed-btn ed-btn-default" onclick="closeEditor()">取消</button>

        </div>
    </div>
</div>

<!-- Keyword Manager Modal -->
<div class="modal-overlay" id="kwmModal">

        </div>

        </div>
        <div class="modal-footer">
            <button class="ed-btn ed-btn-default" onclick="closeKwManager()">关闭</button>
        </div>
    </div>
</div>

/* ===== Answer Cleaning ===== */

function cleanAnswer(text) {
    if (!text) return '';
    const hasHtml = /<[^>]+>/.test(text);
    let cleaned = text;

    if (hasHtml) {
        const hasColor = /<font\b[^>]*\bcolor/i.test(text) ||
                          /\bstyle\s*=\s*["'][^"']*\bcolor\s*:/i.test(text);

        if (hasColor) {
            const doc = new DOMParser().parseFromString('<div>' + text + '</div>', 'text/html');
            const root = doc.body.firstChild;
            const parts = [];

            function getColor(el) {
                while (el && el !== root) {
                    if (el.tagName === 'FONT') {
                        const c = el.getAttribute('color');
                        if (c) return c.trim().toLowerCase();
                    }
                    const st = el.getAttribute && el.getAttribute('style');
                    if (st) {
                        const m = st.match(/(?:^|;)\s*color\s*:\s*([^;]+)/i);
                        if (m) return m[1].trim().toLowerCase();
                    }
                    el = el.parentElement;
                }
                return null;
            }

            function isBlack(c) {
                if (c === null) return true;
                c = c.replace(/\s/g, '').toLowerCase();
                return ['black','#000','#000000','#333','#333333',
                        'rgb(0,0,0)','rgb(51,51,51)'].includes(c);
            }

            const walker = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            let node;
            while ((node = walker.nextNode())) {
                const color = getColor(node.parentElement);
                if (!isBlack(color)) parts.push(node.textContent);
            }
            cleaned = parts.join('').trim();
            if (!cleaned) cleaned = root.textContent.trim();
        } else {
            cleaned = text.replace(/<br\s*\/?>/gi, '\n')
                          .replace(/<\/p>\s*<p[^>]*>/gi, '\n')
                          .replace(/<[^>]+>/g, '').trim();
        }
    }

    cleaned = cleaned.replace(/<br\s*\/?>/gi, '\n')
                      .replace(/<[^>]+>/g, '');

    cleaned = cleaned.replace(/(^|[\n\r]\s*)([A-Da-d])\s*([.、:：)）])/gm, (m, pre, letter, sep) => {
        const num = letter.toUpperCase().charCodeAt(0) - 64;
        return pre + num + sep;
    });

    return cleaned.trim();
}

/* ===== File Handling ===== */

async function handleFile(file) {
    const buf = await file.arrayBuffer();
    let text;
    try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
    catch { text = new TextDecoder('gbk').decode(buf); }
    processCSV(text.replace(/^\uFEFF/, ''));
}

function parseCSV(text) {
    const rows = [];
    const len = text.length;
    let pos = 0;

    function readField() {
        let val = '';
        if (pos < len && text[pos] === '"') {
            pos++;
            while (pos < len) {
                if (text[pos] === '"') {
                    if (pos + 1 < len && text[pos + 1] === '"') { val += '"'; pos += 2; }
                    else { pos++; break; }
                } else { val += text[pos]; pos++; }
            }
        } else {
            while (pos < len && text[pos] !== ',' && text[pos] !== '\r' && text[pos] !== '\n') {
                val += text[pos]; pos++;
            }
        }
        return val.trim();
    }

    while (pos < len) {
        if (text[pos] === '\r' || text[pos] === '\n') { pos++; continue; }
        const fields = [];
        while (true) {
            fields.push(readField());
            if (pos < len && text[pos] === ',') { pos++; continue; }
            break;
        }
        if (pos < len && text[pos] === '\r') pos++;
        if (pos < len && text[pos] === '\n') pos++;
        if (fields.length >= 3 && fields.some(f => f)) rows.push(fields);
    }
    return rows;
}

const PUNCT_MAP = {'（':'(','）':')','，':',','。':'.','：':':','；':';',
    '？':'?','！':'!','\u201c':'"','\u201d':'"','\u2018':"'",'\u2019':"'",
    '【':'[','】':']','、':',','〈':'<','〉':'>','《':'<','》':'>',
    '～':'~','—':'-','…':'...'};
const PUNCT_RE = new RegExp('[' + Object.keys(PUNCT_MAP).join('').replace(/[\[\]\\]/g,'\\$&') + ']', 'g');
function normPunct(s) { return s.replace(PUNCT_RE, c => PUNCT_MAP[c] || c); }

function dedup(rows) {
    const seen = new Map(), uniq = [], dups = [];
    for (const r of rows) {
        const key = normPunct(r[1] + '\x00' + r[2]).toLowerCase();
        if (seen.has(key)) dups.push(r);
        else { seen.set(key, true); uniq.push(r); }
    }
    return { uniq, dups };
}

function processCSV(text) {
    let rows = parseCSV(text);
    if (rows.length > 0) {
        const f = rows[0][0].toLowerCase().trim();
        if (['序号','id','no','number','#','编号','index','题号'].includes(f)) rows = rows.slice(1);
    }

    rows.forEach(r => { r[2] = cleanAnswer(r[2]); });

    const csvCount = rows.length, prevCount = questions.length;
    const { uniq } = dedup([...questions, ...rows]);
    questions = uniq; saveStore();
    const newAdded = uniq.length - prevCount, dupsRemoved = csvCount - newAdded;
    rebuildIndex(); updateUploadZone();
    if (dupsRemoved > 0) { $('dupInfo').textContent = `本次上传 ${csvCount} 题，${dupsRemoved} 题重复已跳过`; $('dupInfo').style.display = 'block'; }
    else { $('dupInfo').style.display = 'none'; }
    if (newAdded > 0) { $('addInfo').textContent = prevCount === 0 ? `已加载 ${newAdded} 道题` : `新增 ${newAdded} 道题（原有 ${prevCount} 题）`; $('addInfo').style.display = 'block'; }
    else { $('addInfo').textContent = '没有新题目添加（全部重复）'; $('addInfo').style.display = 'block'; }
}

/* ===== Pinyin Initial ===== */

function getInitial(str) {
    const c = str.charAt(0);
    if (/[a-zA-Z]/.test(c)) return c.toUpperCase();
    if (!/[\u4e00-\u9fff]/.test(c)) return '#';
    for (let i = PINYIN_MAP.length - 1; i >= 0; i--) {
        if (c.localeCompare(PINYIN_MAP[i][1], 'zh-CN') >= 0) return PINYIN_MAP[i][0];
    }
    return '#';
}

/* ===== Tokenization with compound dictionary ===== */

function tokenize(text) {
    const tokens = [];
    const textLow = text.toLowerCase();

    const compMatches = [];
    for (const term of ZH_COMPOUNDS) {
        let idx = textLow.indexOf(term);
        while (idx !== -1) {
            compMatches.push({ term, start: idx, end: idx + term.length });
            idx = textLow.indexOf(term, idx + 1);
        }
    }
    const kept = compMatches.filter(m =>
        !compMatches.some(o => o !== m && o.start <= m.start && o.end >= m.end && (o.end - o.start) > (m.end - m.start))
    );
    for (const m of kept) tokens.push(m.term);

    const bracketRe = /[（(]([^）)]{1,30})[）)]/g;
    let m;
    while ((m = bracketRe.exec(text)) !== null) {
        const inner = m[1].trim();
        if (!inner) continue;
        const innerLow = inner.toLowerCase();
        if (/^[a-zA-Z][a-zA-Z0-9\s\-]*$/.test(inner)) {
            const words = inner.split(/\s+/);
            if (words.length <= 3) {
                if (words.length === 1) {
                    if (validKw(innerLow)) tokens.push(innerLow);
                } else {
                    tokens.push(innerLow);
                    for (const w of words) { const wl = w.toLowerCase(); if (validKw(wl)) tokens.push(wl); }
                }
            }
        } else if (/[\u4e00-\u9fff]/.test(inner) && inner.length <= 10) {
            if (validKw(innerLow)) tokens.push(innerLow);
        }
    }

    const enRe = /[a-zA-Z][a-zA-Z0-9]*(?:-[a-zA-Z0-9]+)*/g;
    while ((m = enRe.exec(text)) !== null) { const w = m[0].toLowerCase(); if (validKw(w)) tokens.push(w); }

    const zhText = text.replace(/[a-zA-Z0-9\-]+/g, ' ');
    if (typeof Intl !== 'undefined' && Intl.Segmenter) {
        const seg = new Intl.Segmenter('zh-CN', { granularity: 'word' });
        for (const s of seg.segment(zhText)) {
            if (s.isWordLike) { const w = s.segment.trim(); if (w && /[\u4e00-\u9fff]/.test(w) && validKw(w)) tokens.push(w); }
        }
    } else {
        const zhRe = /[\u4e00-\u9fff]{2,}/g;
        while ((m = zhRe.exec(zhText)) !== null) { if (validKw(m[0])) tokens.push(m[0]); }
    }
    return [...new Set(tokens)];
}

function validKw(w) {
    if (!w || /^\d+$/.test(w) || /^\d+[\.\d]*$/.test(w)) return false;
    if (EN_STOP.has(w.toLowerCase())) return false;
    if (ZH_STOP.has(w)) return false;
    if (/^[a-z]$/i.test(w) || /^[a-z]{2}$/i.test(w)) return false;
    if (/^[\u4e00-\u9fff]$/.test(w)) return false;
    return true;
}

/* ===== Keyword Extraction ===== */

function isChinese(w) { return /[\u4e00-\u9fff]/.test(w); }
function isCompound(w) { return ZH_COMPOUNDS.includes(w.toLowerCase()); }

function bestCase(wLow, qs, qIds) {
    if (/[\u4e00-\u9fff]/.test(wLow)) return wLow;
    const counts = new Map();
    const re = new RegExp(escRe(wLow), 'gi');
    const indices = qIds || [];
    const src = indices.length > 0 ? indices.map(i => qs[i]) : qs;
    for (const q of src) {
        let m;
        while ((m = re.exec(q[1])) !== null) {
            const form = m[0];
            counts.set(form, (counts.get(form) || 0) + 1);
        }
    }
    if (counts.size === 0) return wLow;
    let best = wLow, bestN = 0;
    for (const [form, n] of counts) {
        if (n > bestN) { best = form; bestN = n; }
    }
    return best;
}

function buildKeywords(qs) {
    const N = qs.length; if (N === 0) return {};
    const qTokens = qs.map(q => tokenize(q[1]));
    const wordIdx = new Map();
    for (let i = 0; i < N; i++) {
        for (const w of qTokens[i]) { if (!wordIdx.has(w)) wordIdx.set(w, new Set()); wordIdx.get(w).add(i); }
    }

    const freqCap = Math.max(Math.floor(N * 0.15), 5);

    const picked = new Set();
    for (let i = 0; i < N; i++) {
        const all = [...new Set(qTokens[i])];
        const scored = all.map(w => {
            const freq = wordIdx.get(w)?.size || 0;
            if (isChinese(w) && freq <= 1) return { w, score: -1 };
            if (freq > freqCap) return { w, score: -1 };
            let score = Math.log(N / Math.max(freq, 1));
            if (isCompound(w)) score *= 1.5;
            return { w, score };
        });
        scored.sort((a, b) => b.score - a.score);
        for (const { w, score } of scored.slice(0, 2)) {
            if (score > 0) picked.add(w);
        }
    }

    const result = {};
    for (const w of picked) {
        const qIds = wordIdx.has(w) ? [...wordIdx.get(w)] : [];
        if (qIds.length > 0) result[w] = { word: w, qIds, display: bestCase(w, qs, qIds) };
    }

    const kwWords = Object.keys(result);
    const toRemove = new Set();
    for (const x of kwWords) {
        const superKeys = kwWords.filter(y => y !== x && y.includes(x));
        if (superKeys.length === 0) continue;
        const xSet = new Set(result[x].qIds);
        const allCovered = [...xSet].every(qid =>
            superKeys.some(y => result[y] && result[y].qIds.includes(qid))
        );
        if (allCovered) toRemove.add(x);
    }
    for (const w of toRemove) delete result[w];

    const sigMap = new Map();
    for (const [w, kw] of Object.entries(result)) {
        const sig = [...kw.qIds].sort((a, b) => a - b).join(',');
        if (sigMap.has(sig)) {
            const prev = sigMap.get(sig);
            if (isCompound(w) && !isCompound(prev)) { delete result[prev]; sigMap.set(sig, w); }
            else if (!isCompound(w) && isCompound(prev)) { delete result[w]; }
            else if (w.length < prev.length) { delete result[prev]; sigMap.set(sig, w); }
            else { delete result[w]; }
        } else { sigMap.set(sig, w); }
    }

    const uncovered = new Set();
    for (let i = 0; i < N; i++) uncovered.add(i);
    const kept = new Set();
    const candidates = Object.entries(result).map(([w, kw]) => ({ w, ids: new Set(kw.qIds) }));
    while (uncovered.size > 0 && candidates.length > 0) {
        let bestIdx = -1, bestCnt = 0;
        for (let i = 0; i < candidates.length; i++) {
            let cnt = 0;
            for (const id of candidates[i].ids) if (uncovered.has(id)) cnt++;
            if (cnt > bestCnt) { bestCnt = cnt; bestIdx = i; }
        }
        if (bestIdx === -1 || bestCnt === 0) break;
        kept.add(candidates[bestIdx].w);
        for (const id of candidates[bestIdx].ids) uncovered.delete(id);
        candidates.splice(bestIdx, 1);
    }
    for (const w of Object.keys(result)) {
        if (!kept.has(w)) delete result[w];
    }

    return result;
}

/* ===== Unit Extraction ===== */

function extractUnits(qs) {
    const escaped = UNIT_PATTERNS.map(u => u.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&'));
    const re = new RegExp('\\d+(?:\\.\\d+)?\\s*(' + escaped.join('|') + ')(?![a-zA-Z\\u4e00-\\u9fff])', 'gi');
    const found = new Map();
    for (const q of qs) { for (const text of [q[1], q[2]]) { let m; while ((m = re.exec(text)) !== null) { const u = m[1], norm = u.toLowerCase(); if (!found.has(norm)) found.set(norm, u); } } }
    return [...found.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(e => e[1]);
}

let voiceRec = null;
let voiceActive = false;
let voiceBase = '';

function initVoiceRec() {
    if (voiceRec) return true;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('当前浏览器不支持语音输入，请使用 Chrome 或 Safari'); return false; }
    voiceRec = new SR();
    voiceRec.lang = 'zh-CN';
    voiceRec.interimResults = true;
    voiceRec.continuous = true;
    voiceRec.maxAlternatives = 1;
    voiceRec.onresult = function(e) {
        let interim = '', final = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
            const t = e.results[i][0].transcript;
            if (e.results[i].isFinal) final += t; else interim += t;
        }
        const combined = (voiceBase ? voiceBase + ' ' : '') + final + interim;
        $('textSearch').value = combined;
        textQuery = combined;
        $('textSearchClear').style.display = combined ? '' : 'none';
        $('kwFilter').value = combined;
        $('kwFilterClear').style.display = combined ? '' : 'none';
        refreshAll();
    };
    voiceRec.onerror = function(e) {
        if (e.error === 'not-allowed') alert('请允许麦克风权限后刷新页面，HTTPS 网站只需允许一次');
        else if (e.error !== 'aborted' && e.error !== 'no-speech') stopVoice();
    };
    voiceRec.onend = function() {
        if (voiceActive) {
            try { voiceRec.start(); } catch { stopVoice(); }
        }
    };
    return true;
}

function toggleVoice() {
    if (voiceActive) { stopVoice(); return; }
    if (!initVoiceRec()) return;
    voiceBase = $('textSearch').value;
    try { voiceRec.start(); } catch { voiceRec = null; if (!initVoiceRec()) return; voiceRec.start(); }
    voiceActive = true;
    $('voiceBtn').classList.add('recording');
    $('voiceIndicator').classList.add('on');
    $('voiceBtn').title = '点击停止语音输入';
}

function stopVoice() {
    voiceActive = false;
    if (voiceRec) { try { voiceRec.stop(); } catch {} }
    $('voiceBtn').classList.remove('recording');
    $('voiceIndicator').classList.remove('on');
    $('voiceBtn').title = '语音输入';
}

/* ===== Search / Filter ===== */

function getFiltered() {
    let indices = allIdx();

    if (selected.size > 0) {
        const sets = [...selected].map(w => {
            const kw = kwData[w]; if (!kw) return new Set();
            return new Set(kw.qIds);
        });
        let res = new Set(sets[0]);
        for (let i = 1; i < sets.length; i++) res = new Set([...res].filter(x => sets[i].has(x)));
        indices = [...res];
    }

    if (textQuery.trim()) {
        const terms = textQuery.toLowerCase().split(/\s+/).filter(t => t);
        indices = indices.filter(i => {
            const q = questions[i], qL = q[1].toLowerCase(), aL = q[2].toLowerCase();
            return terms.every(t => (scopeQ && qL.includes(t)) || (scopeA && aL.includes(t)));
        });
    }

    const numRe = buildNumRe();
    if (numRe) {
        indices = indices.filter(i => {
            const q = questions[i];
            return (scopeQ && numRe.test(q[1])) || (scopeA && numRe.test(q[2]));
        });
    }
    return applySortOrder(indices);
}

function applySortOrder(indices) {
    const mode = $('sortMode') ? $('sortMode').value : 'default';
    if (mode === 'alpha') {
        return indices.sort((a, b) => {
            const qa = questions[a][1], qb = questions[b][1];
            return qa.localeCompare(qb, 'zh-CN');
        });
    }
    if (mode === 'similar') {
        return sortBySimilarity(indices);
    }
    return indices.sort((a, b) => a - b);
}

function onSortChange() { refreshResults(); }

function sortBySimilarity(indices) {
    if (indices.length <= 1) return indices;

    const texts = indices.map(i => questions[i][1].toLowerCase());
    const bigrams = texts.map(t => {
        const s = new Set();
        for (let i = 0; i < t.length - 1; i++) s.add(t.substring(i, i + 2));
        return s;
    });

    function sim(a, b) {
        if (a.size === 0 && b.size === 0) return 1;
        let inter = 0;
        for (const x of a) if (b.has(x)) inter++;
        return (2 * inter) / (a.size + b.size);
    }

    const n = indices.length;
    const used = new Uint8Array(n);
    const order = [0];
    used[0] = 1;

    for (let step = 1; step < n; step++) {
        const last = order[step - 1];
        let bestJ = -1, bestSim = -1;
        for (let j = 0; j < n; j++) {
            if (used[j]) continue;
            const s = sim(bigrams[last], bigrams[j]);
            if (s > bestSim) { bestSim = s; bestJ = j; }
        }
        used[bestJ] = 1;
        order.push(bestJ);
    }

    return order.map(j => indices[j]);
}

function buildNumRe() {
    if (!numInput && !selUnit) return null;
    let p = '';
    if (numInput) p += '(?<![\\d.])' + numInput.replace(/\./g, '\\.') + '(?![\\d.])';
    if (numInput && selUnit) p += '\\s*';
    if (selUnit) p += escRe(selUnit);
    try { return new RegExp(p, 'i'); } catch { return null; }
}

function buildCard(idx) {
    const q = questions[idx], card = document.createElement('div');
    card.className = 'q-card';
    let qH = esc(q[1]), aH = esc(q[2]);

    const hlTerms = [];
    for (const w of selected) hlTerms.push(escRe(w));
    if (textQuery.trim()) for (const t of textQuery.split(/\s+/).filter(t => t)) hlTerms.push(escRe(t));

    for (const t of hlTerms) {
        const re = new RegExp(`(${t})`, 'gi');
        if (scopeQ) qH = qH.replace(re, '<span class="hl">$1</span>');
        if (scopeA) aH = aH.replace(re, '<span class="hl">$1</span>');
    }
    const numRe = buildNumRe();
    if (numRe) {
        const hlRe = new RegExp(`(${numRe.source})`, 'gi');
        if (scopeQ) qH = qH.replace(hlRe, '<span class="hl">$1</span>');
        if (scopeA) aH = aH.replace(hlRe, '<span class="hl">$1</span>');
    }
    card.innerHTML = `<div class="q-num"><span class="q-edit-btn" data-idx="${idx}">编辑</span>#${esc(q[0])}</div><div class="q-text">${qH}</div>
        <div class="a-wrap open" onclick="this.classList.toggle('open')"><div class="a-lbl"><span class="arrow">▶</span> 答案</div><div class="a-body">${aH}</div></div>`;
    card.querySelector('.q-edit-btn').addEventListener('click', e => { e.stopPropagation(); openEditor(idx); });
    return card;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

/* ===== Custom Keywords Store ===== */

let customKw = {};

function applyCustomKw() {
    for (const [oldW, info] of Object.entries(customKw)) {
        if (info && info.renamed && info.renamed !== oldW) {
            const data = kwData[oldW];
            if (data) {
                delete kwData[oldW];
                const newW = info.renamed;
                if (kwData[newW]) {
                    const merged = new Set([...kwData[newW].qIds, ...data.qIds]);
                    kwData[newW].qIds = [...merged];
                    kwData[newW].display = bestCase(newW, questions, kwData[newW].qIds);
                } else {
                    kwData[newW] = { word: newW, qIds: data.qIds, display: bestCase(newW, questions, data.qIds) };
                }
            }
        }
    }
    for (const w of Object.keys(customKw)) {
        if (customKw[w] === null) {
            delete kwData[w];
        } else if (customKw[w] && customKw[w].added) {
            if (!kwData[w]) {
                const qIds = [];
                const wl = w.toLowerCase();
                for (let i = 0; i < questions.length; i++) {
                    if (questions[i][1].toLowerCase().includes(wl) || questions[i][2].toLowerCase().includes(wl)) qIds.push(i);
                }
                if (qIds.length > 0) kwData[w] = { word: w, qIds, display: bestCase(w, questions, qIds) };
            }
        }
    }
    for (const kw of Object.values(kwData)) {
        if (!kw.display) kw.display = bestCase(kw.word, questions, kw.qIds);
    }
    sortAndUpdateKwList();
}

function sortAndUpdateKwList() {
    kwList = Object.values(kwData).sort((a, b) => {
        const ai = getInitial(a.word), bi = getInitial(b.word);
        if (ai !== bi) return ai.localeCompare(bi);
        const aEn = /^[a-z]/i.test(a.word), bEn = /^[a-z]/i.test(b.word);
        if (aEn !== bEn) return aEn ? -1 : 1;
        return a.word.localeCompare(b.word, 'zh-CN');
    });
    $('sKw').textContent = kwList.length;
}

function cleanEmptyKw() {
    for (const [w, kw] of Object.entries(kwData)) {
        if (!kw.qIds || kw.qIds.length === 0) delete kwData[w];
    }
    sortAndUpdateKwList();
}

    if (!sel) return;
    if (!edKws.includes(sel)) { edKws.push(sel); edKws.sort(); renderEdKwChips(); }
    $('edSelHint').style.display = 'none';
    $('edAddSelBtn').style.display = 'none';
}

function edSave() {
    if (edIdx < 0) return;
    const newQ = $('edQ').value.trim();
    const newA = $('edA').value.trim();
    if (!newQ) { alert('题目不能为空'); return; }

    questions[edIdx][1] = newQ;
    questions[edIdx][2] = newA;
    saveStore();

    const oldAutoKws = new Set(Object.keys(buildKeywords(questions)));
    for (const w of edKws) {
        if (!oldAutoKws.has(w)) {
            if (!customKw[w]) customKw[w] = { added: true };
        }
    }

    const prevKws = [];
    for (const [w, kw] of Object.entries(kwData)) {
        if (kw.qIds.includes(edIdx)) prevKws.push(w);
    }
    for (const w of prevKws) {
        if (!edKws.includes(w) && !customKw[w]) {
            customKw[w] = null;
        }
    }

    saveCustomKw();

    kwData = buildKeywords(questions);
    applyCustomKw();

    for (const w of edKws) {
        if (!kwData[w]) kwData[w] = { word: w, qIds: [], display: bestCase(w, questions, [edIdx]) };
        if (!kwData[w].qIds.includes(edIdx)) kwData[w].qIds.push(edIdx);
        if (!kwData[w].display) kwData[w].display = bestCase(w, questions, kwData[w].qIds);
    }

    cleanEmptyKw();

    closeEditor();
    renderKwChips();
    refreshResults();
}

function edDelete() {
    if (edIdx < 0) return;
    if (!confirm('确定删除此题吗？')) return;
    const delIdx = edIdx;

    questions.splice(delIdx, 1);
    saveStore();

    for (const [w, info] of Object.entries(customKw)) {
        if (info && info.added) {
            const wl = w.toLowerCase();
            const hasMatch = questions.some(q => q[1].toLowerCase().includes(wl));
            if (!hasMatch) { customKw[w] = null; }
        }
    }
    saveCustomKw();

    kwData = buildKeywords(questions);
    applyCustomKw();
    cleanEmptyKw();

    unitList = extractUnits(questions);
    $('sTotal').textContent = questions.length;
    $('sKw').textContent = kwList.length;
    $('sUnit').textContent = unitList.length;

    closeEditor();
    selected.clear();
    renderKwChips(); renderUnits(); syncNumUI();
    renderResults(getFiltered());
    updateUploadZone();
}

/* ===== Keyword Manager ===== */

function openKwManager() {
    $('kwmSearch').value = '';
    renderKwmList();
    $('kwmModal').classList.add('open');
}

function closeKwManager() {
    $('kwmModal').classList.remove('open');
    renderKwChips();
    refreshResults();
}

function renderKwmList() {
    const box = $('kwmList');
    box.innerHTML = '';
    const filter = ($('kwmSearch').value || '').toLowerCase();
    const items = kwList.filter(k => !filter || k.word.includes(filter));
    if (items.length === 0) { box.innerHTML = '<div class="kwm-empty">没有匹配的关键词</div>'; return; }
    const frag = document.createDocumentFragment();
    for (const k of items) {
        const row = document.createElement('div');
        row.className = 'kwm-row';
        row.innerHTML = `<span class="kwm-word">${esc(k.display || k.word)}</span><span class="kwm-cnt">${k.qIds.length}题</span>
            <div class="kwm-actions">
                <button class="kwm-btn" data-action="rename" data-w="${esc(k.word)}">重命名</button>
                <button class="kwm-btn" data-action="merge" data-w="${esc(k.word)}">合并</button>
                <button class="kwm-btn danger" data-action="delete" data-w="${esc(k.word)}">删除</button>
            </div>`;
        row.querySelectorAll('.kwm-btn').forEach(btn => {
            btn.addEventListener('click', () => kwmAction(btn.dataset.action, btn.dataset.w));
        });
        frag.appendChild(row);
    }
    box.appendChild(frag);
}

function kwmAction(action, word) {
    if (action === 'delete') {
        if (!confirm(`确定删除关键词「${word}」吗？`)) return;
        delete kwData[word];
        customKw[word] = null;
        saveCustomKw();
        refreshKwmAfterChange();
    } else if (action === 'rename') {
        const newName = prompt(`将「${word}」重命名为：`, word);
        if (!newName || newName.trim() === '' || newName.trim().toLowerCase() === word.toLowerCase()) return;
        const nn = newName.trim().toLowerCase();
        const data = kwData[word];
        if (!data) return;
        delete kwData[word];
        if (kwData[nn]) {
            const merged = new Set([...kwData[nn].qIds, ...data.qIds]);
            kwData[nn].qIds = [...merged];
            kwData[nn].display = bestCase(nn, questions, kwData[nn].qIds);
        } else {
            const allIds = data.qIds;
            kwData[nn] = { word: nn, qIds: allIds, display: bestCase(nn, questions, allIds) };
        }
        customKw[word] = { renamed: nn };
        saveCustomKw();
        refreshKwmAfterChange();
    } else if (action === 'merge') {
        const target = prompt(`将「${word}」合并到哪个关键词？（输入目标关键词）`);
        if (!target || target.trim() === '') return;
        const tn = target.trim().toLowerCase();
        if (tn === word.toLowerCase()) return;
        const data = kwData[word];
        if (!data) return;
        delete kwData[word];
        if (kwData[tn]) {
            const merged = new Set([...kwData[tn].qIds, ...data.qIds]);
            kwData[tn].qIds = [...merged];
            kwData[tn].display = bestCase(tn, questions, kwData[tn].qIds);
        } else {
            kwData[tn] = { word: tn, qIds: data.qIds, display: bestCase(tn, questions, data.qIds) };
        }
        customKw[word] = null;
        if (!customKw[tn]) customKw[tn] = { added: true };
        saveCustomKw();
        refreshKwmAfterChange();
    }
}

function refreshKwmAfterChange() {
    cleanEmptyKw();
    renderKwmList();
}

/* ===== Keyword Export / Import ===== */

function kwExport(fmt) {
    const rows = kwList.map(k => ({
        word: k.word,
        display: k.display || k.word,
        count: k.qIds.length,
        qIds: k.qIds
    }));
    if (fmt === 'json') {
        downloadBlob(JSON.stringify(rows, null, 2), 'keywords.json', 'application/json');
    } else if (fmt === 'csv') {
        const csvEsc = s => '"' + String(s).replace(/"/g, '""') + '"';
        let csv = '\uFEFF关键词,显示名,题目数,题目ID\n';
        for (const r of rows) csv += [csvEsc(r.word), csvEsc(r.display), r.count, csvEsc(r.qIds.join(';'))].join(',') + '\n';
        downloadBlob(csv, 'keywords.csv', 'text/csv;charset=utf-8');
    } else if (fmt === 'xlsx') {
        downloadXlsx(rows);
    }
}

function downloadBlob(content, name, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; a.click();
    URL.revokeObjectURL(url);
}

function downloadXlsx(rows) {
    const xmlEsc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    let sheet = '<?xml version="1.0" encoding="UTF-8"?>\n' +
        '<?mso-application progid="Excel.Sheet"?>\n' +
        '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n' +
        '<Worksheet ss:Name="关键词"><Table>\n';
    sheet += '<Row><Cell><Data ss:Type="String">关键词</Data></Cell>' +
        '<Cell><Data ss:Type="String">显示名</Data></Cell>' +
        '<Cell><Data ss:Type="Number">题目数</Data></Cell>' +
        '<Cell><Data ss:Type="String">题目ID</Data></Cell></Row>\n';
    for (const r of rows) {
        sheet += `<Row><Cell><Data ss:Type="String">${xmlEsc(r.word)}</Data></Cell>` +
            `<Cell><Data ss:Type="String">${xmlEsc(r.display)}</Data></Cell>` +
            `<Cell><Data ss:Type="Number">${r.count}</Data></Cell>` +
            `<Cell><Data ss:Type="String">${xmlEsc(r.qIds.join(';'))}</Data></Cell></Row>\n`;
    }
    sheet += '</Table></Worksheet></Workbook>';
    downloadBlob(sheet, 'keywords.xls', 'application/vnd.ms-excel');
}

let pendingImport = null;

function kwImportFileHandler(input) {
    const file = input.files[0];
    if (!file) return;
    input.value = '';
    const ext = file.name.split('.').pop().toLowerCase();
    const reader = new FileReader();

    if (ext === 'json') {
        reader.onload = function(e) {
            let data;
            try { data = JSON.parse(e.target.result); } catch { alert('JSON 格式错误'); return; }
            if (!Array.isArray(data)) { alert('JSON 需要是关键词数组'); return; }
            pendingImport = data.map(k => ({ word: (k.word || '').toLowerCase(), display: k.display || k.word || '' }));
            showImportDialog(pendingImport);
        };
        reader.readAsText(file);
    } else if (ext === 'csv') {
        reader.onload = function(e) {
            const text = e.target.result;
            const parsed = parseKwCsv(text);
            if (!parsed || parsed.length === 0) { alert('CSV 中没有找到有效的关键词'); return; }
            pendingImport = parsed;
            showImportDialog(pendingImport);
        };
        reader.readAsText(file, 'UTF-8');
    } else if (ext === 'xlsx' || ext === 'xls') {
        reader.onload = function(e) {
            const text = e.target.result;
            const parsed = parseKwXml(text);
            if (!parsed || parsed.length === 0) { alert('Excel 文件中没有找到有效的关键词（仅支持 XML Spreadsheet 格式，即本工具导出的格式）'); return; }
            pendingImport = parsed;
            showImportDialog(pendingImport);
        };
        reader.readAsText(file, 'UTF-8');
    } else {
        alert('不支持的文件格式，请使用 .json / .csv / .xls 文件');
    }
}

function parseKwCsv(text) {
    const lines = text.replace(/\r\n?/g, '\n').split('\n');
    const results = [];
    let startRow = 0;
    if (lines.length > 0 && /关键词|keyword|word/i.test(lines[0])) startRow = 1;
    for (let i = startRow; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        const cols = [];
        let inQ = false, cur = '';
        for (let c = 0; c < line.length; c++) {
            const ch = line[c];
            if (ch === '"') { if (inQ && line[c+1] === '"') { cur += '"'; c++; } else { inQ = !inQ; } }
            else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
            else { cur += ch; }
        }
        cols.push(cur.trim());
        const word = (cols[0] || '').replace(/^\uFEFF/, '').toLowerCase();
        if (!word) continue;
        const display = cols[1] || cols[0] || word;
        results.push({ word, display });
    }
    return results;
}

function parseKwXml(text) {
    const results = [];
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'text/xml');
    const rows = doc.querySelectorAll('Row');
    let startRow = 0;
    if (rows.length > 0) {
        const firstCell = rows[0].querySelector('Data');
        if (firstCell && /关键词|keyword|word/i.test(firstCell.textContent)) startRow = 1;
    }
    for (let i = startRow; i < rows.length; i++) {
        const cells = rows[i].querySelectorAll('Cell');
        if (cells.length === 0) continue;
        const word = (cells[0].textContent || '').trim().toLowerCase();
        if (!word) continue;
        const display = cells.length > 1 ? (cells[1].textContent || '').trim() : word;
        results.push({ word, display });
    }
    return results;
}

function showImportDialog(data) {
    const body = $('kwImportBody');
    const footer = $('kwImportFooter');
    const existingWords = new Set(kwList.map(k => k.word));
    const newKws = data.filter(k => !existingWords.has(k.word.toLowerCase()));
    const dupKws = data.filter(k => existingWords.has(k.word.toLowerCase()));

    let html = `<p style="font-size:13px;margin-bottom:10px">共 <b>${data.length}</b> 个关键词`;
    if (dupKws.length > 0) {
        html += `，其中 <b style="color:#e6a23c">${dupKws.length}</b> 个与现有关键词重复`;
    }
    html += `，<b style="color:#67c23a">${newKws.length}</b> 个为新增。</p>`;

    if (dupKws.length > 0) {
        html += `<div class="dup-list-box">`;
        html += `<div style="font-weight:600;margin-bottom:4px;color:#666">重复关键词：</div>`;
        for (const k of dupKws) {
            html += `<span class="dup-item">${esc(k.display || k.word)}</span>　`;
        }
        html += `</div>`;
    }
    body.innerHTML = html;

    footer.innerHTML = '';
    const btnClose = document.createElement('button');
    btnClose.className = 'ed-btn ed-btn-default';
    btnClose.textContent = '取消';
    btnClose.onclick = () => $('kwImportModal').classList.remove('open');

    const btnOverwrite = document.createElement('button');
    btnOverwrite.className = 'ed-btn ed-btn-danger';
    btnOverwrite.textContent = '全部覆盖';
    btnOverwrite.onclick = () => doImport('overwrite');

    footer.appendChild(btnClose);

    if (dupKws.length > 0 && newKws.length > 0) {
        const btnSkip = document.createElement('button');
        btnSkip.className = 'ed-btn ed-btn-default';
        btnSkip.textContent = `仅导入新增 (${newKws.length})`;
        btnSkip.style.borderColor = '#67c23a'; btnSkip.style.color = '#67c23a';
        btnSkip.onclick = () => doImport('skip-dup');
        footer.appendChild(btnSkip);
    }
    footer.appendChild(btnOverwrite);

    if (newKws.length > 0 || dupKws.length > 0) {
        const btnMerge = document.createElement('button');
        btnMerge.className = 'ed-btn ed-btn-primary';
        btnMerge.textContent = '增量合并（全部）';
        btnMerge.onclick = () => doImport('merge-all');
        footer.appendChild(btnMerge);
    }

    $('kwImportModal').classList.add('open');
}

function doImport(mode) {
    if (!pendingImport) return;
    const data = pendingImport;
    pendingImport = null;

    if (mode === 'overwrite') {
        kwData = {};
        customKw = {};
        for (const k of data) {
            const w = k.word.toLowerCase();
            const qIds = [];
            for (let i = 0; i < questions.length; i++) {
                if (questions[i][1].toLowerCase().includes(w) || questions[i][2].toLowerCase().includes(w)) qIds.push(i);
            }
            if (qIds.length > 0) {
                kwData[w] = { word: w, qIds, display: bestCase(w, questions, qIds) };
                customKw[w] = { added: true };
            }
        }
    } else {
        const existingWords = new Set(Object.keys(kwData));
        const items = mode === 'skip-dup'
            ? data.filter(k => !existingWords.has(k.word.toLowerCase()))
            : data;
        for (const k of items) {
            const w = k.word.toLowerCase();
            const qIds = [];
            for (let i = 0; i < questions.length; i++) {
                if (questions[i][1].toLowerCase().includes(w) || questions[i][2].toLowerCase().includes(w)) qIds.push(i);
            }
            if (qIds.length > 0) {
                if (kwData[w]) {
                    const merged = new Set([...kwData[w].qIds, ...qIds]);
                    kwData[w].qIds = [...merged];
                    kwData[w].display = bestCase(w, questions, kwData[w].qIds);
                } else {
                    kwData[w] = { word: w, qIds, display: bestCase(w, questions, qIds) };
                }
                if (!customKw[w]) customKw[w] = { added: true };
            }
        }
    }

    saveCustomKw();
    cleanEmptyKw();
    renderKwmList();
    $('kwImportModal').classList.remove('open');
}

init();
